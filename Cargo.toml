[package]
name = "chronobreak"
version = "0.1.0"
edition = "2024"
publish = false

[[example]]
name = "knowledge_document"
test = true

[[example]]
name = "knowledge_workbench"
test = true

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies]
arboard = { version = "3.6", default-features = false }
bytemuck = { version = "1.23", features = ["derive"] }
glyphon = "0.9"
pollster = "0.4"
taffy = "0.7"
unicode-segmentation = "1.13.3"
wgpu = "25"
winit = "0.30"
